[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engimind"
version = "0.1.0"
description = "Document question answering with source-aware retrieval for PDF and CSV files"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
engimind-mcp = "engimind.mcp_server.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["engimind*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
